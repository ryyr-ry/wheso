name: ci

# 公開リポジトリでのみ実行する。private では Actions の実行時間が課金対象になるため、
# リポジトリが public であることをジョブの先頭で確認し、public でなければ失敗させる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: このリポジトリが public であることを確認する
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private リポジトリでは実行しない（課金を避けるため）"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: codegen:check
        run: npm run codegen:check

      - name: vectors:check
        run: npm run vectors:check

      - name: naming:check
        run: npm run naming:check

      - name: auth:check
        run: npm run auth:check

      - name: capacity:check
        run: npm run capacity:check

      - name: forbidden:check
        run: npm run forbidden:check

      - name: trace:check
        run: npm run trace:check

      - name: trace:receiver:check
        run: npm run trace:receiver:check

      - name: fuzz:check
        run: npm run fuzz:check

      - name: tests
        run: npm test

      - name: 結合試験（局所実行環境の Durable Object に対する実接続）
        run: npm run test:integration

      - name: Chromium を導入する（E2E 用）
        run: npx playwright install --with-deps chromium

      - name: E2E（実映像の符号化・転送・復号と画素の一致）
        run: npm run test:e2e

      - name: Rust の適合試験（凍結ベクタとの一致）
        run: npm run test:rust

      - name: C++ の適合試験（凍結ベクタとの一致）
        run: npm run test:cpp

      - name: Dart を導入する
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart の適合試験（凍結ベクタとの一致）
        run: npm run test:dart
