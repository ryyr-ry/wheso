name: ci

# 公開リポジトリでのみ実行する。private では Actions の実行時間が課金対象になるため、
# リポジトリが public であることを各ジョブの先頭で確認し、public でなければ失敗させる。
#
# ジョブの分け方: 検査は互いに独立であるため**並列**に走らせる。1 本の直列ジョブにすると、
# 言語ごとの道具の導入と構築が積み上がり、待ち時間が実際の測定時間を何桁も上回る
# （手元の直列実行では 1 言語あたり 30 分を超えた）。
#
# 疎通試験（段 B）と結合試験と E2E は**実際にデプロイしたノード**に対して行う。
# 局所実行環境（partykit dev）は本番と前提が違うため使わない。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 実環境に触れない検査（型・生成物・凍結ベクタ・トレース・実データ・単体） ──
  static:
    runs-on: ubuntu-latest
    steps:
      - name: このリポジトリが public であることを確認する
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private リポジトリでは実行しない（課金を避けるため）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run codegen:check
      - run: npm run vectors:check
      - run: npm run naming:check
      - run: npm run auth:check
      - run: npm run capacity:check
      - run: npm run forbidden:check
      - run: npm run trace:check
      - run: npm run trace:receiver:check
      - name: real-media:check（実 AV1 / Opus の凍結資産）
        run: npm run real-media:check
      - run: npm run fuzz:check
      - run: npm test

  # ── 各言語 SDK の凍結ベクタ・トレース・実データの照合（並列） ──
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, cpp, dart, kotlin]
    steps:
      - name: このリポジトリが public であることを確認する
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private リポジトリでは実行しない（課金を避けるため）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Dart を導入する
        if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: JDK を導入する
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle を導入する
        if: matrix.language == 'kotlin'
        uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run test:${{ matrix.language }}

  # Swift は macOS でのみ構築できる。public リポジトリでは実行時間が無償である。
  sdk-swift:
    runs-on: macos-latest
    steps:
      - name: このリポジトリが public であることを確認する
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private リポジトリでは実行しない（課金を避けるため）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Swift の適合試験（凍結ベクタ・トレース・実データ）
        run: bash sdks/swift/run-tests.sh

  # ── 段 D の土台: 劣化（tc netem）が実際に効くことを確かめる ──
  # 手元の作業機では tc の変更に root が無く確かめられない。CI の runner では sudo が使える。
  impair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: このリポジトリが public であることを確認する
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private リポジトリでは実行しない（課金を避けるため）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: root で tc を触れることを確認する
        run: sudo -n tc qdisc show dev lo
      - name: 劣化が実際に効いていることを測る
        run: node tools/impair.ts selftest

  # ── 実環境へ 1 度だけデプロイする。以降のジョブは WHESO_SKIP_DEPLOY=1 で使い回す ──
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.mark.outputs.deployed }}
    steps:
      - name: このリポジトリが public であることを確認する
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private リポジトリでは実行しない（課金を避けるため）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 実環境へデプロイする
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          WHESO_LIVE_HOST: ${{ secrets.WHESO_LIVE_HOST }}
        run: |
          # **配備先は試験する相手から導く。** 企画名を別に持つと、片方だけを書き換えた
          # ときに「A へ配備して B を試験する」状態になる。名前が定まらなければ配備しない
          # （設定ファイルの既定へ落ちると、同じ帳場の無関係な企画を上書きする）。
          if [ -z "$WHESO_LIVE_HOST" ]; then
            echo "WHESO_LIVE_HOST が無い。配備先が定まらないため配備しない"
            exit 1
          fi
          WHESO_PARTYKIT_PROJECT="${WHESO_LIVE_HOST%%.*}"
          export WHESO_PARTYKIT_PROJECT
          if [ -z "$WHESO_PARTYKIT_PROJECT" ]; then
            echo "WHESO_PARTYKIT_PROJECT が空。配備先が定まらないため配備しない"
            exit 1
          fi
          echo "配備先のプロジェクト: $WHESO_PARTYKIT_PROJECT"
          npm run deploy:test
      - id: mark
        run: echo "deployed=yes" >> "$GITHUB_OUTPUT"

  # ── 実環境に対する結合試験と E2E（並列） ──
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [integration, e2e]
    env:
      WHESO_LIVE_HOST: ${{ secrets.WHESO_LIVE_HOST }}
      WHESO_SKIP_DEPLOY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Chromium を導入する（E2E 用）
        if: matrix.kind == 'e2e'
        run: npx playwright install --with-deps chromium
      - name: 実環境に対する試験
        run: npm run test:${{ matrix.kind }}

  # ── 段 D（劣化）: プロファイルごとに並列。劣化は tc netem でループバックへ適用する ──
  degrade:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ['N-0', 'N-1', 'N-2', 'N-3', 'N-4', 'N-5', 'N-6', 'N-7', 'N-8']
    env:
      WHESO_LIVE_HOST: ${{ secrets.WHESO_LIVE_HOST }}
      WHESO_SKIP_DEPLOY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Chromium を導入する
        run: npx playwright install --with-deps chromium
      - name: xvfb を導入する（headed Chrome 用）
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: root で tc を触れることを確認する
        run: sudo -n tc qdisc show dev lo
      - name: 劣化下の記録と判定
        # **器は SDK 経由である**（F-10）。生の WebSocket の器は `ack` を返さないため、
        # 購読単位の送信窓（ADR-0025）を入れた後は `ACK_TIMEOUT_MS` で切断される
        # （実測: 9 本すべてが code=4034 で落ちた）。判定するのは製品の判断である。
        # **headed Chrome で回す**（F-083）。headless では AudioContext.currentTime
        # のドリフトが不安定で D-1 p99 が閾値を超える（実測: 31〜130ms のばらつき）。
        # xvfb-run で仮想ディスプレイを与え、headless: false で起動する。
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' node --test --test-force-exit --test-name-pattern='SDK 経由 ${{ matrix.profile }}:' tests/e2e/degrade-sdk.test.ts

  # ── 段 B（疎通）: 5 言語が実環境へ実データを流す。言語ごとに並列 ──
  transport:
    needs: deploy
    runs-on: ubuntu-latest
    # 固まったまま何十分も回らないように時限を切る。実測では 1 言語 2 分で終わる。
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        language: [kotlin, dart, rust, cpp, swift]
    env:
      WHESO_LIVE_HOST: ${{ secrets.WHESO_LIVE_HOST }}
      WHESO_SKIP_DEPLOY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Dart を導入する
        if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: JDK を導入する
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle を導入する
        if: matrix.language == 'kotlin'
        uses: gradle/actions/setup-gradle@v4
      - name: Swift を導入する
        if: matrix.language == 'swift'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: npm ci
      - name: 疎通試験（実環境。否定対照を含む）
        run: node tools/transport-suite.ts ${{ matrix.language }}
